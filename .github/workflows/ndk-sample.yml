name: Android NDK C++ sample

on:
  push:
    branches: [main, master, "feature/android-ndk-cpp"]
    paths:
      - "samples/android-ndk-cpp/**"
      - ".github/workflows/ndk-sample.yml"
  pull_request:
    paths:
      - "samples/android-ndk-cpp/**"
      - ".github/workflows/ndk-sample.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ndk-sample-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build C++17 JNI APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK, NDK and CMake
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018 cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK with native C++
        run: gradle -p samples/android-ndk-cpp :app:assembleDebug --no-daemon --stacktrace

      - name: Verify native libraries were packaged
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find samples/android-ndk-cpp/app/build/outputs/apk/debug -name '*.apk' -print -quit)
          test -n "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" list "$APK" | grep -E '^lib/(arm64-v8a|x86_64)/libnative-lib\.so$'
          echo "Built APK: $APK"

      - name: Upload sample APK
        uses: actions/upload-artifact@v4
        with:
          name: codeassist-ndk-cpp-sample
          path: samples/android-ndk-cpp/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
